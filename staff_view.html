<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>スタッフ用ポータル</title>
    <!-- LINEのLIFF SDKを読み込み -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; }
      .card { background: #fff; padding: 24px; border-radius: 8px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
      h2 { color: #2c3e50; font-size: 1.2rem; margin-top: 0; }
      p { font-size: 0.9rem; color: #666; line-height: 1.5; margin-bottom: 20px; }
      button { background: #27ae60; color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; padding: 14px; }
      button:hover { background: #219653; }
      .portal-container { display: none; }
    </style>
  </head>
  <body>

    <!-- 💡 iframe内にいる場合の誘導画面（クリックによるユーザー操作を生むため） -->
    <div id="redirectCard" class="card" style="display: none;">
      <h2>👋 スタッフポータルへようこそ</h2>
      <p>安全にシステムを起動するため、下のボタンをタップしてポータル画面を開いてください。</p>
      <button type="button" onclick="escapeIframeAndOpen()">スタッフポータルを開く</button>
    </div>

    <!-- 本来のスタッフポータル画面 -->
    <div id="portalContent" class="portal-container" style="width: 100%; max-width: 450px;">
      <h2>Staff Portal</h2>
      <p style="text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 12px;">スタッフ名: <strong id="staffNameDisplay"><?= staffName ?></strong></p>

      <div class="portal-tabs" style="display: flex; gap: 4px; margin-bottom: 12px; background: #eaeded; padding: 3px; border-radius: 6px;">
        <button id="tabPref" class="portal-tab-btn active" onclick="switchStaffTab('pref')" style="background: #fff; border: none; padding: 8px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; flex: 1; font-weight: bold;">📅 シフト希望提出</button>
        <button id="tabKintai" class="portal-tab-btn" onclick="switchStaffTab('kintai')" style="background: transparent; border: none; padding: 8px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; flex: 1; font-weight: bold; color: #555;">⏰ 勤怠・交通費申請</button>
      </div>
      
      <div id="viewPref" class="card" style="text-align: left; margin: 0;">
        <h3 style="margin-top:0; font-size:1rem; color:#2c3e50;">シフト希望の提出</h3>
        <input type="hidden" id="staffId" value="<?= staffId ?>">
        <input type="hidden" id="staffNameVal" value="<?= staffName ?>">

        <div class="month-selector" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <label style="margin:0; font-size:0.85rem;">対象月:</label>
          <input type="month" id="targetMonth" onchange="renderMiniCalendar()" style="width: 140px; padding: 6px;">
        </div>

        <p style="font-size: 0.75rem; color: #666; margin: 0 0 6px 0;">💡 出勤できる日をタップして選択してください。</p>
        <div id="selectedCount" style="text-align: center; font-size: 0.85rem; color: #e67e22; font-weight: bold; margin-bottom: 6px;">選択中の日数: 0日</div>

        <div class="mini-cal-grid" id="miniCalendarGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 12px;">
          <div style="text-align: center; font-weight: bold; font-size: 0.75rem; padding: 4px; background: #eaeded; color: #c0392b;">日</div>
          <div style="text-align: center; font-weight: bold; font-size: 0.75rem; padding: 4px; background: #eaeded;">月</div>
          <div style="text-align: center; font-weight: bold; font-size: 0.75rem; padding: 4px; background: #eaeded;">火</div>
          <div style="text-align: center; font-weight: bold; font-size: 0.75rem; padding: 4px; background: #eaeded;">水</div>
          <div style="text-align: center; font-weight: bold; font-size: 0.75rem; padding: 4px; background: #eaeded;">木</div>
          <div style="text-align: center; font-weight: bold; font-size: 0.75rem; padding: 4px; background: #eaeded;">金</div>
          <div style="text-align: center; font-weight: bold; font-size: 0.75rem; padding: 4px; background: #eaeded; color: #2980b9;">土</div>
        </div>

        <button type="button" class="btn-green" onclick="submitPreferences()" style="background: #27ae60; color: white; border: none; border-radius: 4px; padding: 12px; width: 100%; font-weight: bold; cursor: pointer;">シフト希望を送信する</button>
      </div>

      <div id="viewKintai" class="card" style="display: none; text-align: left; margin: 0;">
        <h3 style="margin-top:0; font-size:1rem; color:#2c3e50;">勤怠・交通費の申請</h3>
        <form id="kintaiForm">
          <label style="display:block; margin-top:10px; font-weight:bold; font-size:0.85rem;">勤務日</label>
          <input type="date" id="workDate" required style="width:100%; padding:8px; margin-top:4px; box-sizing:border-box;">
          
          <label style="display:block; margin-top:10px; font-weight:bold; font-size:0.85rem;">出勤時刻</label>
          <input type="time" id="startTime" required style="width:100%; padding:8px; margin-top:4px; box-sizing:border-box;">
          
          <label style="display:block; margin-top:10px; font-weight:bold; font-size:0.85rem;">退勤時刻</label>
          <input type="time" id="endTime" required style="width:100%; padding:8px; margin-top:4px; box-sizing:border-box;">
          
          <label style="display:block; margin-top:10px; font-weight:bold; font-size:0.85rem;">休憩時間 (分)</label>
          <input type="number" id="breakTime" value="60" min="0" step="15" required style="width:100%; padding:8px; margin-top:4px; box-sizing:border-box;">
          
          <label style="display:block; margin-top:10px; font-weight:bold; font-size:0.85rem;">交通費 (円)</label>
          <input type="number" id="transportCost" value="0" min="0" required style="width:100%; padding:8px; margin-top:4px; box-sizing:border-box;">
          
          <button type="button" onclick="submitKintai()" style="background: #3498db; color: white; border: none; border-radius: 4px; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 16px;">申請を送信する</button>
        </form>
      </div>
    </div>

    <script>
      window.onload = function() {
        var now = new Date();
        var y = now.getFullYear();
        var m = String(now.getMonth() + 1).padStart(2, '0');
        var d = String(now.getDate()).padStart(2, '0');
        
        document.getElementById('targetMonth').value = y + '-' + m;
        renderMiniCalendar();
        document.getElementById('workDate').value = y + '-' + m + '-' + d;

        // 💡 最初からポータルコンテンツを表示する
        document.getElementById('portalContent').style.display = 'block';

        var staffId = document.getElementById('staffId').value;
        if (staffId) {
          initializeLiffAndLink(staffId);
        }
      };

      function initializeLiffAndLink(staffId) {
        var liffId = "2012184145-HMvvN2iP"; 

        liff.init({ liffId: liffId })
          .then(function() {
            if (!liff.isLoggedIn()) {
              liff.login(); // リダイレクトループを防ぐため単純なloginに変更
              return;
            }
            
            liff.getProfile().then(function(profile) {
              var lineUserId = profile.userId;

              google.script.run
                .withSuccessHandler(function(res) {
                  if (res.success && res.isNewlyLinked) {
                    console.log("LINE IDが自動紐付けされました！");
                  }
                })
                .checkAndLinkStaffAccess(staffId, lineUserId);

            }).catch(function(err) {
              console.log('プロフィール取得失敗: ', err);
            });
          })
          .catch(function(err) {
            console.log('LIFF初期化失敗: ', err);
          });
      }

      function switchStaffTab(mode) {
        var tabPref = document.getElementById('tabPref');
        var tabKintai = document.getElementById('tabKintai');
        var viewPref = document.getElementById('viewPref');
        var viewKintai = document.getElementById('viewKintai');

        if (mode === 'pref') {
          tabPref.style.background = '#fff';
          tabPref.style.color = '#2c3e50';
          tabKintai.style.background = 'transparent';
          tabKintai.style.color = '#555';
          viewPref.style.display = 'block';
          viewKintai.style.display = 'none';
        } else {
          tabKintai.style.background = '#fff';
          tabKintai.style.color = '#2c3e50';
          tabPref.style.background = 'transparent';
          tabPref.style.color = '#555';
          viewKintai.style.display = 'block';
          viewPref.style.display = 'none';
        }
      }

      var cachedClosedDays = [];

      function renderMiniCalendar() {
        var ymVal = document.getElementById('targetMonth').value;
        if (!ymVal) return;

        google.script.run
          .withSuccessHandler(function(res) {
            cachedClosedDays = res.success ? res.closedDays : [];
            buildMiniCalendarGrid(ymVal);
          })
          .getClosedDays(ymVal);
      }

      function buildMiniCalendarGrid(ymVal) {
        var parts = ymVal.split('-');
        var year = Number(parts[0]);
        var month = Number(parts[1]);

        var grid = document.getElementById('miniCalendarGrid');
        var headerHtml = '';
        var headers = grid.querySelectorAll('div');
        for(var i=0; i<7; i++) {
          headerHtml += headers[i].outerHTML;
        }
        var html = headerHtml;

        var firstDayObj = new Date(year, month - 1, 1);
        var lastDayObj = new Date(year, month, 0);
        var firstDayOfWeek = firstDayObj.getDay();
        var totalDays = lastDayObj.getDate();
        var prevLastDayObj = new Date(year, month - 1, 0);
        var prevLastDay = prevLastDayObj.getDate();

        for (var i = 0; i < firstDayOfWeek; i++) {
          var pDay = prevLastDay - (firstDayOfWeek - 1 - i);
          html += '<div style="aspect-ratio:1; background:#f9f9f9; opacity:0.3; display:flex; align-items:center; justify-content:center; font-size:0.85rem; border:1px solid #dcdcdc; border-radius:4px;"><span>' + pDay + '</span></div>';
        }

        for (var day = 1; day <= totalDays; day++) {
          var mStr = String(month).padStart(2, '0');
          var dStr = String(day).padStart(2, '0');
          var dateStr = year + '-' + mStr + '-' + dStr;
          
          var isClosed = cachedClosedDays.includes(dateStr);
          var isSelected = selectedDatesMap[dateStr];
          
          var bgStyle = isClosed ? 'background:#e5e7eb; color:#9ca3af; border:1px dashed #9ca3af;' : (isSelected ? 'background:#27ae60; color:white; font-weight:bold;' : 'background:#fff; border:1px solid #dcdcdc;');
          var clickAction = isClosed ? '' : 'onclick="toggleDate(\'' + dateStr + '\')"';
          
          html += '<div style="aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:0.85rem; border-radius:4px; cursor:pointer; ' + bgStyle + '" ' + clickAction + '>';
          html += '<div><span>' + day + '</span>';
          if (isClosed) {
            html += '<span style="font-size:0.55rem; display:block; line-height:1;">休業日</span>';
          }
          html += '</div></div>';
        }

        var totalCellsCount = firstDayOfWeek + totalDays;
        var remainingCells = (totalCellsCount % 7 === 0) ? 0 : 7 - (totalCellsCount % 7);
        for (var n = 1; n <= remainingCells; n++) {
          html += '<div style="aspect-ratio:1; background:#f9f9f9; opacity:0.3; display:flex; align-items:center; justify-content:center; font-size:0.85rem; border:1px solid #dcdcdc; border-radius:4px;"><span>' + n + '</span></div>';
        }

        grid.innerHTML = html;
        updateCountDisplay();
      }

      function toggleDate(dateStr) {
        if (selectedDatesMap[dateStr]) {
          delete selectedDatesMap[dateStr];
        } else {
          selectedDatesMap[dateStr] = true;
        }
        renderMiniCalendar();
      }

      function updateCountDisplay() {
        var count = Object.keys(selectedDatesMap).length;
        document.getElementById('selectedCount').innerText = '選択中の日数: ' + count + '日';
      }

      function submitPreferences() {
        var datesArray = Object.keys(selectedDatesMap);
        if (datesArray.length === 0) {
          alert('出勤希望日を1日以上選択してください。');
          return;
        }

        var ymVal = document.getElementById('targetMonth').value;
        var data = {
          staffId: document.getElementById('staffId').value,
          staffName: document.getElementById('staffNameVal').value,
          yearMonth: ymVal,
          selectedDates: datesArray
        };

        var btn = event.target;
        btn.disabled = true;
        btn.innerText = '送信中...';

        google.script.run
          .withSuccessHandler(function(res) {
            alert(res.message);
            if (res.success) {
              selectedDatesMap = {};
              renderMiniCalendar();
            }
            btn.disabled = false;
            btn.innerText = 'シフト希望を送信する';
          })
          .saveShiftPreferences(data);
      }

      function submitKintai() {
        var data = {
          staffId: document.getElementById('staffId').value,
          staffName: document.getElementById('staffNameVal').value,
          workDate: document.getElementById('workDate').value,
          startTime: document.getElementById('startTime').value,
          endTime: document.getElementById('endTime').value,
          breakTime: document.getElementById('breakTime').value,
          transportCost: document.getElementById('transportCost').value
        };

        if (!data.workDate || !data.startTime || !data.endTime) {
          alert('必須項目をすべて入力してください。');
        }

        var btn = event.target;
        btn.disabled = true;
        btn.innerText = '送信中...';

        google.script.run
          .withSuccessHandler(function(res) {
            alert(res.message);
            if (res.success) {
              document.getElementById('kintaiForm').reset();
              var now = new Date();
              var y = now.getFullYear();
              var m = String(now.getMonth() + 1).padStart(2, '0');
              var d = String(now.getDate()).padStart(2, '0');
              document.getElementById('workDate').value = y + '-' + m + '-' + d;
              document.getElementById('breakTime').value = "60";
              document.getElementById('transportCost').value = "0";
            }
            btn.disabled = false;
            btn.innerText = '申請を送信する';
          })
          .saveKintaiData(data);
      }
    </script>
  </body>
</html>
